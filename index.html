<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Result System</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <header>
        <h1>🎓 Student Result System</h1>
        <p>Manage Students and Check Results</p>
      </header>

      <!-- Statistics -->
      <div class="stats">
        <div>
          <h3 id="total">0</h3>
          <p>Total Students</p>
        </div>

        <div>
          <h3 id="passed">0</h3>
          <p>Passed</p>
        </div>

        <div>
          <h3 id="failed">0</h3>
          <p>Failed</p>
        </div>
      </div>

      <!-- Add Student Form -->
      <div class="add-student">
        <h2>➕ Add New Student</h2>

        <input type="text" id="studentName" placeholder="Enter student name" />

        <input
          type="number"
          id="studentMarks"
          placeholder="Enter marks (0-100)"
          min="0"
          max="100"
        />

        <button onclick="addStudent()">Add Student</button>
      </div>

      <!-- Main Section -->
      <div class="main">
        <!-- Student List -->
        <div class="student-section">
          <h2>👨‍🎓 Students List</h2>

          <div id="studentList"></div>
        </div>

        <!-- Result Section -->
        <div class="result-section">
          <h2>📊 Check Result</h2>

          <label>Select Student</label>

          <select id="studentSelect">
            <option value="">-- Select Student --</option>
          </select>

          <button id="getMarksBtn" onclick="getMarks()">Get Marks</button>

          <!-- Loading -->
          <div id="loading" class="hidden">
            <div class="spinner"></div>

            <p>Please wait... Fetching marks</p>
          </div>

          <!-- Result -->
          <div id="result"></div>
        </div>
      </div>

      <!-- Footer -->
      <footer>
        Created by <strong>Uzman Quraishi</strong> using HTML, CSS & JavaScript.
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Result System</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🎓 Student Result System</h1>
        <p>Check your academic performance</p>
      </header>

      <div class="main">
        <!-- Student List -->
        <div class="student-section">
          <h2>👥 Students List</h2>
          <div id="studentList"></div>
        </div>

        <!-- Result Section -->
        <div class="result-section">
          <h2>📊 Student Marks</h2>

          <label>Select Student</label>

          <select id="studentSelect" onchange="getMarks(this.value)">
            <option value="">-- Select Student --</option>
          </select>

          <button id="getMarksBtn" onclick="getMarks()">Get Marks</button>

          <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Fetching marks... Please wait</p>
          </div>

          <div id="result"></div>
        </div>
      </div>

      <!-- Statistics -->
      <div class="stats">
        <div>
          <h3 id="total">0</h3>
          <p>Total Students</p>
        </div>

        <div>
          <h3 id="passed">0</h3>
          <p>Passed</p>
        </div>

        <div>
          <h3 id="failed">0</h3>
          <p>Failed</p>
        </div>
      </div>

      <footer>Made by <strong>Uzman Quraishi</strong> using HTML, CSS & JavaScript</footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
